[project]
name = "proto1-backend"
version = "0.1.0"
description = "API do 1º protótipo (TES/UFPI): cadastro, login com JWT e perfil de usuário."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.10",
    "boto3>=1.35",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Starlette >= 1.x usa httpx2 no TestClient (httpx gera aviso de depreciação)
    "httpx2>=2.16",
    "moto[s3]>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W: estilo, F: erros, I: imports, UP: sintaxe moderna, B: bugs comuns, SIM: simplificações
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# A pasta local alembic/ contém migrações, não a biblioteca importada nos testes.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# Padrão do FastAPI (ARQ §5.3): `param = Depends(...)` como valor default é intencional
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Security",
]
