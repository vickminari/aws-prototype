# Configuração do Alembic (migrações do banco, ARQ §5.9).
# A URL do banco NÃO fica aqui: alembic/env.py lê DATABASE_URL via app.core.config.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Arquivos de migração nomeados por data para ficarem em ordem na pasta
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Formata as migrações geradas com o ruff do venv
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
