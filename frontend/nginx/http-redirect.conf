# Com certificado: o HTTP só atende o Let's Encrypt e o health check; o resto vai
# para HTTPS (o cookie de sessão é Secure, docs/DECISAO_AUTENTICACAO.md).
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Renovação do certificado (desafio HTTP-01)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check do deploy.sh e do Docker; não usa cookie nem dados do usuário
    location = /api/health {
        proxy_pass http://api:8000;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
