# HTTPS com o certificado do Let's Encrypt (--cert-name proto1, emitido pelo deploy.sh).
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/proto1/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proto1/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # O navegador passa a usar só HTTPS neste domínio por 1 dia. Curto de propósito:
    # se o certificado falhar, o acesso volta a funcionar no dia seguinte.
    add_header Strict-Transport-Security "max-age=86400" always;

    include /etc/nginx/proto1/app.conf;
}
