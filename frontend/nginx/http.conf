# Sem certificado ainda: a aplicação inteira por HTTP. É o modo do primeiro deploy
# e o que permite ao Let's Encrypt validar o domínio para emitir o certificado.
server {
    listen 80;
    server_name _;

    # Desafio HTTP-01 do Let's Encrypt (arquivos gravados pelo certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/proto1/app.conf;
}
