server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 2 MB: limite do avatar na API (ARQ §5.7) + folga do multipart.
    client_max_body_size 3m;

    # Headers de segurança (ARQ §12). "always" também aplica nas respostas de erro.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API na mesma origem do frontend (sem CORS; cookie HttpOnly de sessão).
    # Origin, Referer e Set-Cookie passam sem alteração (CSRF e sessão, #9).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rotas do React Router caem no index.html.
    location / {
        try_files $uri /index.html;
    }
}
