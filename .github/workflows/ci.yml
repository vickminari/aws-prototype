# CI (ARQ §6.3): lint, formatação, testes e build em todo PR e na main.
# Os jobs "Backend" e "Frontend" são os required checks da branch main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a execução anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # setup-uv não publica tag de versão major (v10); por isso a versão completa
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependências
        run: uv sync --locked --extra dev

      - name: Lint (ruff check)
        run: uv run --no-sync ruff check .

      - name: Formatação (ruff format --check)
        run: uv run --no-sync ruff format --check .

      - name: Testes com cobertura (mínimo 70%)
        run: uv run --no-sync pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Testes (Vitest)
        run: npm run test -- --run

      - name: Build (tsc + Vite)
        run: npm run build
